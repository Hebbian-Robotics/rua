[package]
name = "livekit-cameras"
version = "0.1.8"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
default-run = "hebbian-rua-media"

autobins = false

[[bin]]
name = "hebbian-rua-media"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
livekit-camera-frames = { git = "https://github.com/Hebbian-Robotics/livekit-cameras", rev = "2d018e4074b2c4d4bb806c5ee40b1b216815ed1c" }
livekit-camera-recorder = { git = "https://github.com/Hebbian-Robotics/livekit-cameras", rev = "2d018e4074b2c4d4bb806c5ee40b1b216815ed1c" }
cameras = { git = "https://github.com/Hebbian-Robotics/livekit-cameras", rev = "2d018e4074b2c4d4bb806c5ee40b1b216815ed1c" }
livekit-camera-publisher = { git = "https://github.com/Hebbian-Robotics/livekit-cameras", rev = "2d018e4074b2c4d4bb806c5ee40b1b216815ed1c" }
clap = { version = "4.6.9", features = ["derive"] }
livekit = { version = "=0.11.0", features = ["rustls-tls-native-roots"] }
station-access = { path = "../station-access" }
# Keep the SDK's signaling dependency on the matching release.
livekit-signaling = "=0.2.0"
mcap = "=0.26.0"
hebbian-mcap = { git = "https://github.com/Hebbian-Robotics/mcap-tools", rev = "9a9d57c10cd8adb5d4b5afe27bc2dadb9923b0a1" }
hebbian-contracts = { package = "hebbian-rua-contracts", path = "../contracts" }
axum = "0.8.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nusb = "0.2.9"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
prost = "0.14"
hebbian-rua-core = { path = "../server-core" }
# The run telemetry buffer lives in the station; the recorder test needs a real one.
hebbian-rua-server = { path = "../station" }
tempfile = "3"

[lints]
workspace = true

[package.metadata.cargo-machete]
# WHY: This direct dependency constrains the SDK's transitive signaling release.
ignored = ["livekit-signaling"]
