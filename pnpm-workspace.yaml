# Supply-chain hardening: refuse npm releases younger than 3 days.
# See: https://pnpm.io/settings#minimumreleaseage
packages:
  - typescript-client
  - examples/typescript/agent
minimumReleaseAge: 4320
# WHY: Examples pin the RUA SDK release that was just published.
minimumReleaseAgeExclude:
  - hebbian-rua
allowBuilds:
  esbuild: true
  workerd: true
  "@google/genai": false
  protobufjs: false
