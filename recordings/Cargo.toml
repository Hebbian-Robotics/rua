[package]
name = "recordings"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "hebbian-rua-recordings"

[[bin]]
name = "hebbian-rua-recordings"
path = "src/main.rs"

[dependencies]
hebbian-contracts = { package = "hebbian-rua-contracts", path = "../contracts" }
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[lints]
workspace = true
