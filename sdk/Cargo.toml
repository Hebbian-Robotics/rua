[package]
name = "hebbian-rua"
version = "0.1.5"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Async Rust client for a Hebbian robot-use station: control, commands, sequences, state, cameras and recordings."
repository = "https://github.com/Hebbian-Robotics/rua"
include = ["LICENSE", "README.md", "src/**"]
publish = ["crates-io"]

[lib]
name = "hebbian_rua"

[dependencies]
base64 = "0.22"
hebbian-contracts = { package = "hebbian-rua-contracts", version = "0.1.5", path = "../contracts" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
hebbian-robot-use-core = { path = "../server-core" }
# The run telemetry buffer lives in the station; the telemetry test needs a real one.
hebbian-robot-use-server = { path = "../station" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
