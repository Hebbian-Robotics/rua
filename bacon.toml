[jobs.build]
command = ["cargo", "build"]

[jobs.clippy-all]
command = ["cargo", "clippy", "--all-targets", "--all-features"]

[jobs.python-lint]
command = ["uv", "run", "ruff", "check"]
default_watch = false
watch = ["."]
need_stdout = true

[jobs.python-typecheck]
command = ["uv", "run", "ty", "check"]
default_watch = false
watch = ["."]
need_stdout = true

[jobs.python-test]
command = ["uv", "run", "pytest"]
default_watch = false
watch = ["."]
need_stdout = true

[jobs.typescript-check]
command = ["pnpm", "check"]
default_watch = false
watch = ["."]
need_stdout = true

[jobs.typescript-test]
command = ["pnpm", "exec", "vitest", "run"]
default_watch = false
watch = ["."]
need_stdout = true
