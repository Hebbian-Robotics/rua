id: explanatory-comment-typescript
language: TypeScript
severity: info
message: 'Explanatory comment candidate for paragraph classification.'
ignores:
  - '**/contracts/**'
  - '**/packages/**'
  - '**/typings/**'
  - '**/examples/**'
  - '**/typescript-client/**'
  - '**/hebbian_rua/**'
  - '**/sdk/**'
  - '**/generated/**'
  - '**/station_api.py'
  - '**/http_routes.py'
  - '**/arm_commands.py'
  - '**/generated_robot_tools.py'
rule:
  kind: comment
  not:
    any:
      - regex: '(?s)^(/\*\*|(?://|/\*)\s*(biome-ignore|eslint-|@ts-|istanbul|c8|v8|SPDX-License-Identifier:|Copyright\b|copyright\b))'
