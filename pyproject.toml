[project]
name = "hebbian-rua"
description = "Build robot-use agents with your own model and loop"
readme = "README.md"
version = "0.1.2"
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Hebbian Robotics" },
]
dependencies = [
    "httpx2>=2.16.0",
    "pydantic>=2.11",
    "python-dotenv>=1.2.4",
]

[project.urls]
Repository = "https://github.com/Hebbian-Robotics/rua"
Documentation = "https://github.com/Hebbian-Robotics/rua#readme"

[project.optional-dependencies]
openai = [
    "openai>=3.49.0",
]
anthropic = [
    "anthropic>=2.8.0",
]
gemini = [
    "google-genai>=3.1.0",
]

[project.scripts]
rua = "hebbian_rua.cli:main"

[build-system]
requires = [
    "uv_build>=0.13.6,<0.14",
]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 days"

[tool.uv.build-backend]
module-root = ""
module-name = "hebbian_rua"

[tool.uv.sources.hebbian-rua]
workspace = true

[tool.uv.sources.rua-dev]
workspace = true

[tool.uv.workspace]
members = [
    "tooling",
]
exclude = [
    "examples/python",
    "examples/mujoco_sim",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "C901",
    "UP",
    "ANN",
    "PTH",
    "RET",
    "SIM",
    "TID",
    "RUF",
    "PLE",
    "LOG",
    "PGH003",
    "PGH004",
    "PLW0108",
    "PLC3002",
    "PT010",
    "PT011",
    "PT012",
    "PT014",
    "PT016",
    "PT017",
    "PT018",
    "PT028",
    "PT030",
    "PT031",
    "ASYNC210",
    "ASYNC220",
    "ASYNC221",
    "ASYNC222",
    "ASYNC230",
    "ASYNC250",
    "ASYNC251",
]
ignore = [
    "E501",
    "B008",
    "RET504",
    "ANN401",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
division-by-zero = "error"
deprecated = "error"
unused-ignore-comment = "error"
invalid-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
possibly-unresolved-reference = "error"

[tool.ty.src]
exclude = [
    "hebbian_rua/client/contract/station_api.py",
]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "onnx",
    "onnxruntime",
    "torch",
]

[[tool.ty.overrides]]
include = [
    "scripts/export_so101_policy_onnx.py",
]

[tool.ty.overrides.rules]
incompatible-mutable-override = "ignore"

[tool.ty.environment]
extra-paths = [
    "typings",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-q"

[dependency-groups]
dev = [
    "rua-dev",
    "openai>=3.49.0",
    "anthropic>=2.8.0",
    "google-genai>=3.1.0",
    "datamodel-code-generator>=0.89.0",
    "mujoco>=3.17.0",
    "pillow>=12.3.0",
    "numpy>=2",
    "pytest>=9.2.0",
    "ruff",
    "ty",
]
