[project]
name = "hebbian-rua"
description = "Build robot-use agents with your own model and loop"
readme = "README.md"
version = "0.1.5"
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Hebbian Robotics" },
]
dependencies = [
    "pydantic>=2.11",
    "python-dotenv>=1.2.4",
]

[project.urls]
Repository = "https://github.com/Hebbian-Robotics/rua"
Documentation = "https://github.com/Hebbian-Robotics/rua#readme"

[project.optional-dependencies]
openai = [
    "openai>=3.49.0",
]
anthropic = [
    "anthropic>=2.8.0",
]
gemini = [
    "google-genai>=3.1.0",
]

[project.scripts]
rua = "hebbian_rua.cli:main"

[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "python-bindings/Cargo.toml"
module-name = "hebbian_rua.bindings._native"
python-source = "."
bindings = "pyo3"
profile = "python-extension"
locked = true

[tool.uv]
exclude-newer = "3 days"
cache-keys = [
    { file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" },
    { file = "python-bindings/Cargo.toml" }, { file = "python-bindings/src/**/*.rs" },
    { file = "sdk/Cargo.toml" }, { file = "sdk/src/**/*.rs" },
    { file = "contracts/Cargo.toml" }, { file = "contracts/src/**/*.rs" },
]

[tool.uv.sources.hebbian-rua]
workspace = true

[tool.uv.sources.rua-dev]
workspace = true

[tool.uv.workspace]
members = [
    "tooling",
]
exclude = [
    "examples/python",
    "examples/mujoco_sim",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "C901",
    "UP",
    "ANN",
    "PTH",
    "RET",
    "SIM",
    "TID",
    "RUF",
    "PLE",
    "LOG",
    "PGH003",
    "PGH004",
    "PLW0108",
    "PLC3002",
    "PT010",
    "PT011",
    "PT012",
    "PT014",
    "PT016",
    "PT017",
    "PT018",
    "PT028",
    "PT030",
    "PT031",
    "ASYNC210",
    "ASYNC220",
    "ASYNC221",
    "ASYNC222",
    "ASYNC230",
    "ASYNC250",
    "ASYNC251",
]
ignore = [
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
division-by-zero = "error"
deprecated = "error"
unused-ignore-comment = "error"
invalid-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
possibly-unresolved-reference = "error"

[tool.ty.src]
exclude = [
    "hebbian_rua/client/contract/station_api.py",
]

[tool.ty.environment]
extra-paths = [
    "typings",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-q"
markers = [
    "server: requires the Rust station binary",
    "typescript: requires Node.js and pnpm for TypeScript integration tests",
]

[tool.importlinter]
root_packages = [
    "hebbian_rua",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "client transformations are independent of live station and provider adapters"
type = "forbidden"
source_modules = [
    "hebbian_rua.client.llm.tool_catalog",
    "hebbian_rua.client.llm.response_format",
    "hebbian_rua.client.llm.types",
    "hebbian_rua.client.rotations",
]
forbidden_modules = [
    "hebbian_rua.client.station_client",
    "hebbian_rua.client.environment",
    "hebbian_rua.client.llm.robot_tools",
    "hebbian_rua.client.llm.openai",
    "hebbian_rua.client.llm.anthropic",
    "hebbian_rua.client.llm.gemini",
    "asyncio",
    "httpx2",
    "socket",
    "subprocess",
    "urllib",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "rua-dev",
    "openai>=3.49.0",
    "anthropic>=2.8.0",
    "google-genai>=3.1.0",
    "datamodel-code-generator>=0.89.0",
    "mujoco>=3.17.0",
    "pillow>=12.3.0",
    "import-linter>=2.15",
    "numpy>=2",
    "pytest>=9.2.0",
    "ruff",
    "ty",
    "psutil>=7.2.2",
]
