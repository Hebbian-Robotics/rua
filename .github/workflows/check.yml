name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    if: github.repository == 'Hebbian-Robotics/rua'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install link checker
        run: cargo install lychee --version 0.24.2 --locked
      - name: Check documentation links and anchors
        run: lychee --offline --include-fragments --extensions md README.md CONTRIBUTING.md docs examples

  comments:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
      - name: Install ast-grep
        run: bash tooling/comment-policy/install-ci-ast-grep.sh
      - run: uv sync --locked
      - run: uv run python tooling/comment-policy/check.py
      - run: uv run pytest -o addopts= tooling/comment-policy/tests/test_check.py

  python:
    if: github.repository == 'Hebbian-Robotics/rua'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
      - name: Install ast-grep
        run: bash tooling/comment-policy/install-ci-ast-grep.sh
      - run: uv sync --locked
      - run: uv run rua-dev validate --lane python
      - run: uv lock --check --project examples/python
      - name: Check documented Python agent entry point
        run: uv run python examples/python/agent_quickstart.py --help

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    if: github.repository == 'Hebbian-Robotics/rua'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y pkg-config mold libudev-dev libglib2.0-dev clang-21 libclang-21-dev ffmpeg
          {
            echo 'CC=clang-21'
            echo 'CXX=clang++-21'
          } >> "$GITHUB_ENV"
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          {
            echo 'CC=clang'
            echo 'CXX=clang++'
            echo 'MACOSX_DEPLOYMENT_TARGET=14.0'
            echo 'TMPDIR=/tmp'
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks-${{ matrix.os }}
          env-vars: CC CXX MACOSX_DEPLOYMENT_TARGET
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
      - name: Prepare pinned robot assets
        run: uv run rua-dev setup
      - run: rustup show active-toolchain
      - name: Install unused-dependency checker
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Install architecture dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: uv run rua-dev check-architecture
      - run: cargo fmt --all -- --check
      - run: cargo machete --with-metadata --skip-target-dir
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: uv run rua-dev contracts --check
