name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      documentation: ${{ steps.classify.outputs.documentation }}
      comments: ${{ steps.classify.outputs.comments }}
      python: ${{ steps.classify.outputs.python }}
      typescript: ${{ steps.classify.outputs.typescript }}
      rust: ${{ steps.classify.outputs.rust }}
      integration: ${{ steps.classify.outputs.integration }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        run: python3 .github/scripts/check_lanes.py

  documentation:
    needs: changes
    if: ${{ needs.changes.outputs.documentation == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-check-node
      - run: pnpm lint:docs
      - name: Install link checker
        run: cargo install lychee --version 0.24.2 --locked
      - name: Check documentation links and anchors
        run: >-
          lychee --offline --include-fragments --extensions md
          README.md CONTRIBUTING.md THIRD_PARTY_NOTICES.md docs examples cli/README.md
          hebbian_rua/client/README.md livekit-cameras/README.md recordings/README.md
          robot-geometry/README.md sdk/README.md server-core/README.md station-access/README.md
          tooling/source-doc-lint/README.md typescript-client/README.md
          CODE_OF_CONDUCT.md SECURITY.md

  comments:
    needs: changes
    if: ${{ needs.changes.outputs.comments == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install source-doc-lint
        run: bash tooling/source-doc-lint/install-ci.sh
      - run: source-doc-lint --config source-doc-lint.toml

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true
      - name: Install source-doc-lint
        run: bash tooling/source-doc-lint/install-ci.sh
      - run: uv sync --locked
      - run: uv run rua-dev validate --lane python
      - run: uv lock --check --project examples/python
      - if: ${{ hashFiles('examples/mujoco_sim/pyproject.toml') != '' }}
        run: uv lock --check --project examples/mujoco_sim
      - name: Check documented Python agent entry point
        run: uv run python examples/python/agent_quickstart.py --help

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-check-station
        with:
          cache-platform: ${{ matrix.os }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup show active-toolchain
      - name: Install unused-dependency checker
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Install architecture dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: uv run rua-dev check-architecture
      - run: cargo fmt --all -- --check
      - run: cargo machete --with-metadata --skip-target-dir
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - if: runner.os == 'macOS'
        run: uv run --locked rua-dev contracts --check --targets python rust

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-check-node
      - run: pnpm lint && pnpm typecheck && pnpm knip
      - run: pnpm test:viewer && pnpm build
      - run: pnpm test:package

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-check-station
        with:
          cache-platform: ubuntu-24.04
      - uses: ./.github/actions/setup-check-node
      - run: uv run --locked rua-dev contracts --check
      - name: Run station integration tests
        run: uv run --locked pytest -m server
