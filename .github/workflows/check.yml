name: Cache probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  installed-quickstart:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x16-with-cache
      - nscloud-cache-tag-rua-release-probe-26
      - nscloud-cache-size-50gb
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-check-station
        with:
          install-python-sdk: 'false'
      - uses: ./.github/actions/setup-check-node
      - name: Inventory Cargo fingerprints before packaging
        run: |
          cargo metadata --no-deps --format-version 1 | jq '{target_directory,build_directory}'
          df -h target
          python3 - <<'PYTHON'
          from pathlib import Path
          for path in sorted(Path('target').glob('*')):
              if path.is_dir(): print(path, sum(1 for _ in path.glob('build/*/*/fingerprint')), 'per-unit fingerprints', (path / '.fingerprint').is_dir(), 'legacy directory')
          PYTHON
      - run: sudo apt-get install -y libosmesa6
      - name: Build and run the installed simulator quickstart
        timeout-minutes: 35
        env:
          # The smoke test exercises the assembled packages. Release publishing
          # builds them with the workspace's production optimization settings.
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_LOG: ${{ runner.debug == '1' && 'cargo::core::compiler::fingerprint=info' || '' }}
        run: bash .github/scripts/installed-simulator-quickstart.sh

      - name: Inventory Cargo fingerprints after packaging
        run: |
          cargo metadata --no-deps --format-version 1 | jq '{target_directory,build_directory}'
          df -h target
          python3 - <<'PYTHON'
          from pathlib import Path
          for path in sorted(Path('target').glob('*')):
              if path.is_dir(): print(path, sum(1 for _ in path.glob('build/*/*/fingerprint')), 'per-unit fingerprints', (path / '.fingerprint').is_dir(), 'legacy directory')
          PYTHON
