name: Set up the station for checks
description: Prepare native tools, dependencies, and pinned robot assets
inputs:
  install-python-sdk:
    description: Build and install the Python SDK from the checkout
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install Linux build tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y pkg-config mold libudev-dev libglib2.0-dev clang-21 libclang-21-dev ffmpeg
        {
          echo 'CC=clang-21'
          echo 'CXX=clang++-21'
        } >> "$GITHUB_ENV"
    - name: Install macOS build tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ffmpeg pkg-config
        {
          echo 'CC=clang'
          echo 'CXX=clang++'
          echo 'MACOSX_DEPLOYMENT_TARGET=14.0'
          echo 'TMPDIR=/tmp'
        } >> "$GITHUB_ENV"
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.13.6"
        python-version: "3.14"
        enable-cache: false
    - name: Load the pinned Rust toolchain
      shell: bash
      run: cargo --version
    - name: Attach the Rust and uv cache volume
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: |
          rust
          uv
    - name: Sync the Python environment
      shell: bash
      env:
        INSTALL_PYTHON_SDK: ${{ inputs.install-python-sdk }}
      run: |
        sync_arguments=(--locked)
        if [[ "$INSTALL_PYTHON_SDK" == 'false' ]]; then
          sync_arguments+=(--no-install-package hebbian-rua)
        fi
        uv sync "${sync_arguments[@]}"
    - name: Prepare pinned robot assets
      shell: bash
      run: uv run --no-sync rua-dev setup
