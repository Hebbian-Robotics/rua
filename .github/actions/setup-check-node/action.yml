name: Set up Node for checks
description: Install the pinned Node and pnpm dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Attach the pnpm cache volume
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
