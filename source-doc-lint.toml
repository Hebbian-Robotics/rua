reason = """
Code is the primary documentation. Prefer clear names, types and structure over
comments that repeat the code. Keep comments that explain a non-obvious decision,
invariant, external constraint, safety argument or unfinished work. Start each
ordinary comment paragraph with WHY:, INVARIANT:, CONSTRAINT:, TODO:, SAFETY: or
ROBOT-SAFETY:. Use SAFETY: for the soundness argument of a Rust unsafe operation
and ROBOT-SAFETY: for rules that prevent physical robot hazards.

Docstrings, doc comments and schema descriptions are reserved for the public
interface directories below. Keep useful internal rationale in a classified
comment beside the code. Put consumer-facing descriptions in the owning public schema.
"""

exclude = ["**/target/**", "**/node_modules/**", "**/.venv/**"]

[classification]
labels = ["WHY", "INVARIANT", "CONSTRAINT", "TODO", "SAFETY", "ROBOT-SAFETY"]
exclude = [
    "typings/**",
    "examples/python/**",
    "examples/applications/**",
    "examples/mujoco_sim/**",
    "sdk/src/generated/**",
    "typescript-client/src/generated/**",
    "hebbian_rua/client/contract/station_api.py",
    "hebbian_rua/client/contract/arm_commands.py",
    "hebbian_rua/simulator/contract.py",
    "examples/typescript/viewer/shared/media-status-schema.ts",
    "examples/typescript/viewer/shared/recording-status-schema.ts",
]

[public_interface]
directories = [
    "hebbian_rua/client",
    "hebbian_rua/simulator",
    "typescript-client",
    "sdk",
    "server-core/src/plant.rs",
    "contracts",
    "cli/src/commands",
    "station/src/commands",
    "livekit-cameras/src/config.rs",
    "livekit-cameras/src/lib.rs",
    "livekit-cameras/src/main.rs",
    "livekit-cameras/src/recorder/mod.rs",
]
