reason = """
Code is the primary documentation. Prefer clear names, types and structure over
comments that repeat the code. Keep comments that explain a non-obvious decision,
invariant, external constraint, safety argument or unfinished work. Begin the
paragraph with WHY:, INVARIANT:, CONSTRAINT:, SAFETY: or TODO: and explain why.

Docstrings, doc comments and schema descriptions are reserved for the public
interface directories below. Keep useful internal rationale in a classified
comment beside the code. Put consumer-facing descriptions in the owning public schema.
"""

exclude = ["**/target/**", "**/node_modules/**", "**/.venv/**"]

[classification]
labels = ["WHY", "INVARIANT", "CONSTRAINT", "TODO", "SAFETY"]
exclude = [
    "**/contracts/**",
    "**/typings/**",
    "**/examples/**",
    "**/typescript-client/**",
    "**/hebbian_rua/**",
    "**/sdk/**",
    "**/generated/**",
    "**/station_api.py",
    "**/arm_commands.py",
]

[public_interface]
directories = [
    "hebbian_rua/client",
    "hebbian_rua/simulator",
    "typescript-client",
    "sdk",
    "server-core/src/plant.rs",
    "contracts",
    "cli/src/commands",
    "station/src/commands",
    "livekit-cameras/src/config.rs",
    "livekit-cameras/src/lib.rs",
    "livekit-cameras/src/main.rs",
    "livekit-cameras/src/recorder/mod.rs",
]
