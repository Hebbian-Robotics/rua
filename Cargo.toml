[workspace]
resolver = "3"
members = ["robot-geometry", "contracts", "server-core", "station", "livekit-cameras", "recordings", "station-access", "sdk", "cli"]
# livekit-cameras links libwebrtc (needs clang 21); build it with `-p livekit-cameras`.
default-members = ["robot-geometry", "contracts", "server-core", "station", "recordings", "station-access", "sdk", "cli"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Keep runtime failures explicit; reviewed invariants have local explanations.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
needless_pass_by_ref_mut = "warn"
disallowed_types = "deny"
disallowed_methods = "deny"
todo = "deny"
unimplemented = "deny"

# Line tables alone keep stack traces and panic locations and cut target/ size.
[profile.dev]
debug = "line-tables-only"

# Video conversion needs optimization even when the rest of the station is built
# for development; otherwise live camera frames accumulate noticeable delay.
[profile.dev.package.cameras]
opt-level = 3

[profile.dev.package.image]
opt-level = 2

# WHY: The collision guards run every control cycle and every rehearsed cycle of a policy
# preview. Unoptimized, they take about 11 ms a cycle (55% of a 50 Hz cycle), and a preview
# of a few hundred cycles runs into its 1.5 s limit.
[profile.dev.package.hebbian-robot-geometry]
opt-level = 3

[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

[profile.dev.package.simba]
opt-level = 3

[profile.dev.package.livekit-cameras]
opt-level = 2

# panic = "abort" removes unwinding, so a panic in the loop ends the executor
# rather than unwinding through it; the servos keep holding their last goal.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
