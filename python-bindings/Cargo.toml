[package]
name = "hebbian-rua-python"
version = "0.1.7"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
hebbian-rua = { path = "../sdk" }
pyo3 = { version = "0.30", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde = "1"
tokio = { version = "1", features = ["sync"] }
pythonize = "0.30"

[lints]
workspace = true
