[package]
name = "hebbian-robot-use-core"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
authors = ["Hebbian Robotics"]
license = "MIT"
description = "Robot control, profile resolution, and station HTTP services."
publish = false

[dependencies]
hebbian-robot-geometry = { path = "../robot-geometry" }
hebbian-so101 = { git = "https://github.com/Hebbian-Robotics/so101", rev = "e49063958d104bea803023e9afa67366eb281251", features = ["schema"] }
hebbian-contracts = { path = "../contracts" }
anyhow = "1.0.104"
async-compression = { version = "0.4.52", features = ["tokio", "gzip"] }
axum = "0.8.9"
hdrhistogram = { version = "7.6.0", default-features = false }
libc = "0.2"
nalgebra = "0.35.0"
# The experimental policy loads its ONNX runtime only when selected. Ordinary
# servers do not need the runtime or its platform-specific native libraries.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-31"] }
rsruckig = "3.0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "sync", "io-util", "time", "macros"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.6.11", default-features = false, features = ["fs", "set-header"] }
toml = "0.9.12"
urdf-rs = "0.10.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serialport = { version = "4.10.1", default-features = false }
flate2 = "1.1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
