# Optional original-scale TPU gripper and HBVCAM-W20217 V22 wrist camera.
# Per-arm calibration, servo settings and ports remain in local configuration.
extends = "so101"
name = "so101-soft-gripper-camera"
urdf = "robots/so101/robot-soft-gripper-camera.urdf"
description = """\
Single SO-101 with TPU fingers and a wrist camera attached to the gripper body;
the camera follows wrist_roll. World +X is forward, +Y left, +Z up relative to
the model base. With the base on the same tabletop as the workspace, the
nominal tabletop is Z=0. Tool position is the nominal midpoint between the inward distal
finger surfaces at gripper angle zero, not the lowest point of the fingers.
Tool local +Z points from palm toward fingertips; the jaws close along local X.
One finger is fixed; the other swings toward it when closing.
The camera is above the gripper in the resting pose and looks toward the fingers;
its board connector is on the rear edge nearest the gripper. Optical extrinsics,
image rotation and mirroring are not calibrated. Use images to establish the
current scene, not a fixed camera-to-world mapping.
The arm swings in a vertical plane through shoulder_pan: approach heading follows
the target direction from the base. Wrist roll sets jaw yaw; yaw + 180 gives the
same closing line when one yaw is unreachable. Gripper opening uses this arm's
calibrated endpoints. TPU deformation and secure grasp are not established by
model geometry or estimated contact."""
