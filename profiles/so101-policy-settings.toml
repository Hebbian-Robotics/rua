# The learned reaching policy's settings, shared by every SO-101 profile that uses it
# (so101-policy.toml, so101-sim-policy.toml). The released model is for the arm with the TPU
# gripper and wrist camera (so-supermimic so101-soft-gripper-camera/servo-fit-30000: trained
# on a servo fitted to that arm; simulation-validated only), so a profile that extends this
# uses that arm model. Asset paths are relative to the repository root; put the release's
# files in .cache/so101-policy-assets/.
controller = "policy"

[policy]
# Operating choices for this policy, not defaults for other arms/controllers.
reach_deadline_seconds = 8.0
settle_dwell_seconds = 0.1
settled_velocity_radians_per_second = 0.15
preview_lag_seconds = 0.05
checkpoint_sha256 = "89f9f5a47866d4e2761373e6036adde6277c400f1942ff7f74bd26fda6f7eb63"
# The model's action step: how far ahead of the measured joint it may set a target.
# The tracking guard allows this much on top of the [tracking] margins.
max_target_lead_radians = 0.12
tool_frame_fixture = ".cache/so101-policy-assets/tool-frame.json"
onnx = ".cache/so101-policy-assets/policy.onnx"
max_joint_speed = 2.5
position_tolerance_meters = 0.02
orientation_tolerance_radians = 0.1
