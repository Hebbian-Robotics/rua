# The learned reaching policy's settings, shared by every SO-101 profile that uses it
# (so101-policy.toml, so101-sim-policy.toml). Extend it after the arm's own profile:
# extends = ["so101", "so101-policy-settings"]. Asset paths are relative to the
# repository root; the tool-frame fixture, ONNX export and station
# model come from the so-supermimic release.
controller = "policy"

[policy]
# Operating choices for this policy, not defaults for other arms/controllers.
reach_deadline_seconds = 8.0
settle_dwell_seconds = 0.1
settled_velocity_radians_per_second = 0.15
preview_lag_seconds = 0.05
checkpoint_sha256 = "54ff132307f3c582f0886d82c0592d573452c7c526a9521921e08225beefd51d"
tool_frame_fixture = ".cache/so101-policy-assets/so101-station-tool-frame.json"
onnx = ".cache/so101-policy-assets/policy.onnx"
max_joint_speed = 2.5
position_tolerance_meters = 0.02
orientation_tolerance_radians = 0.1
