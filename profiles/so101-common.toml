# Control defaults shared by the SO-101 hardware and socket plant profiles.
extends = "so101-description"
# This arm may rest up to two degrees outside calibrated endpoints.
# Commands still must recover inward; a profile that sets none allows no leeway.
joint_limit_recovery_tolerance_radians = 0.03490658503988659
self_collision_check = true
arms = ["arm"]
robot_assembly = { manifest = "robots/so101/robot-assemblies.toml", variant = "stock" }
urdf_naming = "plain"

# Provisional pose observed on one calibrated arm resting on its table.
# This is a comparison reference, not proof of physical support or a move target.
# The wide wrist-roll tolerance permits gripper rotation without affecting support.
[rest_reference]
joint_positions_radians = [-0.0037, -1.8435, 1.5765, 1.3296, -1.5536]
joint_tolerances_radians = [0.15, 0.10, 0.10, 0.10, 6.3]

# Nominal tabletop for an SO-101 standing directly on its workspace surface.
# Adjust for raised mounts or measured alignment; leeway accounts for model and
# calibration differences.
[surface_guard]
surface_height_meters = 0.0
leeway_meters = 0.01

[control]
frequency_hertz = 50
# A stalled control cycle is stopped after 200 ms; a longer window delays
# detection of missed feedback and is not a substitute for reliable timing.
loop_deadline_seconds = 0.2

[tracking]
# A joint may trail its command by commanded speed * following_lag_seconds +
# static_margin_radians before the controller trips. Measure lag on each arm
# from target and measured joint angles at the intended operating speeds.
# The static margin is the error allowed at rest.
following_lag_seconds = 0.11
static_margin_radians = 0.1
# Allow a small loaded-servo residual at the target; validate on each arm.
settled_error_radians = 0.05
# A move is done once the arm has stayed within the tolerance for the dwell, about
# 1.4x the following lag; shorter finishes sooner but risks calling an arm settled
# while it is still overshooting. The move ends stopped_short if the full dwell
# has not elapsed within the timeout after the reference stops. Measure on each arm.
settle_dwell_seconds = 0.15
settle_timeout_seconds = 2

[trajectory]
acceleration_limit = 5.0
jerk_limit = 20.0

[motion]
# Conservative starting values from the manual-control setup.
# The maximum is a ceiling, not a full-speed hardware validation.
default_joint_speed = 2.5
max_joint_speed = 2.5

[enable]
preflight_drift_limit_radians = 0.02
enable_drift_limit_radians = 0.05

[guard]
heartbeat_timeout_seconds = 0.5
poll_seconds = 0.05
# Ends a hold the controller abandoned, which also frees the bus for the next
# controller. Servo heating while holding is the temperature trip's, not this.
hold_limit_seconds = 30

[gripper]
# STS3215 motor 6. Angles follow the URDF/MJCF gripper joint (range -0.17 to
# 1.75 rad); check them against the LeRobot calibration on hardware. The force
# cap is a conservative starting value tested on one arm.
closed_position_radians = 0.0
open_position_radians = 1.5
force_fraction = 0.1
position_tolerance_radians = 0.03
contact_dwell_seconds = 0.2

[effort]
# Present_Load magnitude, at 80 % of rated load.
unit = "percent_of_rated_load"
joint_effort_limits = [80.0, 80.0, 80.0, 80.0, 80.0]
