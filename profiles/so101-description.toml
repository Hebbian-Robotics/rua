# Model-facing description of the stock SO-101.
description = """\
SO-101: each arm has five arm joints (shoulder_pan, shoulder_lift,
elbow_flex, wrist_flex, wrist_roll) and a gripper with one fixed and one
swinging jaw. Arm names are in the state; a pair stands side by side, both
facing world +X. Tool poses are URDF gripper_frame_link frames near the jaw
tips in a shared world frame. Cameras named phone_<label> are phones a
person placed; the label describes where, and their poses are unknown.
Camera extrinsics and the table plane are not verified. Gripper opening 0
is closed and 1 is open; contact is an estimate.

Frames: relative to the base, world +X is forward, +Y left, and +Z up,
not relative to the camera image. gripper_frame_link local +Z points toward
the jaw tips; the jaws close along local X. Jaw yaw is a world-frame orientation,
not the wrist_roll joint angle. For the same approach, yaw + 90 degrees gives a
perpendicular closing line; yaw + 180 gives the same line but swaps the fingers.
When either 180-degree alternative suits the task, preview both and prefer less
wrist rotation from the current pose. Wrist limits exclude some yaws. The arm swings in a
vertical plane through its shoulder_pan axis; the target direction from that axis
guides the approach heading. Use preview to check reachability and choose tilt
(down, forward or between). Receipts report achieved approach,
tilt from down, jaw yaw and target errors; the examples specify
orientation, not collision-free grasp positions."""
