# The SO-101 with the TPU gripper and wrist camera, driven by the learned reaching policy
# instead of IK + Ruckig: the executor steps the policy toward each goal pose and ends the
# command when the tool settles. The policy's settings and assets are in
# so101-policy-settings.toml. Run the executor from the repository root.
extends = ["so101-soft-gripper-camera", "so101-policy-settings"]
name = "so101-policy"
