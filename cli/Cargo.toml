[package]
name = "hebbian-rua-cli"
version = "0.1.6"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Command-line client for a Hebbian robot-use station, for coding agents driving the robot from bash."
publish = false

[[bin]]
name = "hebbian-rua"
path = "src/main.rs"
# WHY: The binary shares its name with the hebbian-rua library, so documenting both would collide.
doc = false

[dependencies]
hebbian-rua = { path = "../sdk" }
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
axum = "0.8.9"
hebbian-rua-core = { path = "../server-core" }
hebbian-rua-server = { path = "../station" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }

# Used by the shared integration fixture at sdk/tests/support/simulated_station.rs.
# Machete scans this crate's directory and cannot see that external source module.
[package.metadata.cargo-machete]
ignored = ["hebbian-rua-server"]

[lints]
workspace = true
