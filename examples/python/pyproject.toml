[project]
name = "rua-python-examples"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "hebbian-rua==0.1.4",
    "openai>=3.49.0",
    "anthropic>=2.8.0",
    "google-genai>=3.1.0",
    "pydantic>=2.11",
    "cyclopts>=5.3.2",
]

[tool.uv]
package = false
exclude-newer = "3 days"
exclude-newer-package = { hebbian-rua = false }
