[project]
name = "rua-mujoco-example"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "hebbian-rua==0.1.3",
    "cyclopts>=5.3.2",
    "mujoco>=3.17.0",
    "numpy>=2",
    "pillow>=12.3.0",
    "pydantic>=2.11",
]

[tool.uv]
package = false
exclude-newer = "3 days"
exclude-newer-package = { hebbian-rua = false }
