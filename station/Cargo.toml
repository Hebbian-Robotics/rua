[package]
name = "hebbian-robot-use-server"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
authors = ["Hebbian Robotics"]
license = "MIT"
description = "Robot-use station and supervised motor controller, with HTTP, recordings, and LiveKit access."
readme = "../server-core/README.md"
publish = false

[[bin]]
name = "hebbian-robot-use-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
hdrhistogram = { version = "7.6.0", default-features = false }
dotenvy = "0.15"
hebbian-contracts = { path = "../contracts" }
hebbian-robot-use-core = { path = "../server-core" }
recordings = { path = "../recordings" }
nix = { version = "0.31", features = ["signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.6", default-features = false }
station-access = { path = "../station-access" }
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }

[lints]
workspace = true
