[package]
name = "hebbian-rua-server"
version = "0.1.10"
edition = "2024"
rust-version = "1.92"
authors = ["Hebbian Robotics"]
license = "MIT"
description = "Robot-use station and supervised motor controller, with HTTP, recordings, and LiveKit access."
readme = "../server-core/README.md"
publish = false

[[bin]]
name = "hebbian-rua-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive", "env"] }
hdrhistogram = { version = "7.6.0", default-features = false }
dotenvy = "0.15"
hebbian-contracts = { package = "hebbian-rua-contracts", path = "../contracts" }
hebbian-rua-core = { path = "../server-core" }
recordings = { path = "../recordings" }
nix = { version = "0.31", features = ["signal", "process"] }
which = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.6", default-features = false }
station-access = { path = "../station-access" }
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }

[lints]
workspace = true
