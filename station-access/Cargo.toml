[package]
name = "station-access"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[dependencies]
hebbian-contracts = { path = "../contracts" }
livekit-api = { version = "=0.10.2", default-features = false, features = ["access-token", "services", "rustls-tls-native-roots"] }
livekit-camera-invite = { git = "https://github.com/Hebbian-Robotics/livekit-cameras", rev = "38267051b750c2a6d831603e3ebd8f843df83377" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
base64 = "0.22"
url = "2"
