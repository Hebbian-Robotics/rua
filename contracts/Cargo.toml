[package]
name = "hebbian-rua-contracts"
version = "0.1.3"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Shared wire types for the Hebbian robot-use station API."
repository = "https://github.com/Hebbian-Robotics/rua"
include = ["LICENSE", "src/**"]
publish = ["crates-io"]

[lib]
name = "hebbian_contracts"

[dependencies]
backon = { version = "1.6.0", default-features = false, features = ["std"] }
serde_json = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
