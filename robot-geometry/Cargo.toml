[package]
name = "hebbian-robot-geometry"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[features]
default = ["model"]
model = ["dep:anyhow", "dep:nalgebra", "dep:parry3d-f64", "dep:stl_io", "dep:urdf-rs"]

[dependencies]
hebbian-contracts = { path = "../contracts" }
anyhow = { version = "1.0.104", optional = true }
nalgebra = { version = "0.35.0", optional = true }
parry3d-f64 = { version = "0.31.1", optional = true }
stl_io = { version = "0.11.0", optional = true }
urdf-rs = { version = "0.10.0", optional = true }

[lints]
workspace = true
